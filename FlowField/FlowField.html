<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow Field — Canvas Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../CSS/theme.css">
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    #backgroundCanvas { position: fixed; top: 0; left: 0; z-index: 0; }
  </style>
</head>
<body>

  <canvas id="backgroundCanvas"></canvas>

  <!-- Top-left navigation pill -->
  <div class="hud hud-nav">
    <a class="back-link" href="../index.html">← Home</a>
    <h1 class="demo-title">Flow Field</h1>
    <button class="hud-panel-toggle" id="hudToggle" aria-label="Toggle controls" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/>
      </svg>
    </button>
  </div>

  <div class="hud-panel-backdrop" id="hudBackdrop"></div>

  <!-- Right-side controls panel -->
  <aside class="hud hud-panel" id="hudPanel">

    <div class="hud-panel-header">
      <span class="fps-badge" id="fpsBadge">— fps</span>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span class="toggle-icon">❋</span>
        <span class="toggle-label">Viper</span>
      </button>
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Particles: <span id="countValue"></span></span>
      <input type="range" min="200" max="6000" step="100" class="slider" id="countSlider">
    </div>

    <div class="hud-divider"></div>

    <details class="hud-details" open>
      <summary>Field</summary>
      <div class="hud-section">
        <span class="ctrl-label">Field scale: <span id="scaleValue"></span></span>
        <input type="range" min="5" max="60" step="1" class="slider" id="scaleSlider">
      </div>

      <div class="hud-section">
        <span class="ctrl-label">Speed: <span id="speedValue"></span></span>
        <input type="range" min="0.3" max="4" step="0.1" class="slider" id="speedSlider">
      </div>

      <div class="hud-section">
        <span class="ctrl-label">Field drift: <span id="evolveValue"></span></span>
        <input type="range" min="0" max="3" step="0.05" class="slider" id="evolveSlider">
      </div>

      <div class="hud-section">
        <span class="ctrl-label">Curl: <span id="curlValue"></span></span>
        <input type="range" min="0.5" max="4" step="0.1" class="slider" id="curlSlider">
      </div>
    </details>

    <div class="hud-divider"></div>

    <details class="hud-details">
      <summary>Display</summary>
      <div class="hud-section">
        <span class="ctrl-label">Colour</span>
        <label><input type="radio" name="colorMode" value="angle" checked> By direction</label>
        <label><input type="radio" name="colorMode" value="speed"> By speed</label>
        <label><input type="radio" name="colorMode" value="mono"> Monochrome</label>
      </div>

      <div class="hud-section">
        <span class="ctrl-label">Trail fade: <span id="fadeSpeedValue"></span>%</span>
        <input type="range" min="1" max="30" step="1" class="slider" id="fadeSpeedSlider">
      </div>

      <div class="hud-section">
        <span class="ctrl-label">Options</span>
        <label><input type="checkbox" id="showFieldCheckbox"> Show field arrows</label>
      </div>
    </details>

    <div class="hud-divider"></div>

    <div class="hud-section">
      <span class="ctrl-label">Actions</span>
      <button id="seedButton">New field (N)</button>
      <button id="pauseButton">Pause (Space)</button>
      <button id="resetButton">Reset (R)</button>
    </div>

  </aside>

  <script type="module" src="main.js"></script>
  <script src="../JS/theme.js"></script>
  <script src="../JS/hudUtils.js"></script>
</body>
</html>

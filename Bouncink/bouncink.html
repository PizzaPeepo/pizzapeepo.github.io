<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVD Bounce — Canvas Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../CSS/theme.css">
  <style>
    /* p5 canvas fills viewport — keep body clean */
    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
    canvas { display: block; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.1.9/lib/p5.min.js"></script>
  <script>
    let x, y, xspeed, yspeed, dvd, bbox, textHeight, pepe, font;
    let h;
    var pepescale = 0.23;
    const textSpeed = 3;
    const startingMinutes = 0.4;
    let timeleftSeconds = startingMinutes * 60;
    let countDown = '';
    let countDownFinished = false;
    let cornerHits = 0;
    let celebrationFrames = 0;
    const CELEBRATION_DURATION = 45;
    const CORNER_THRESHOLD = 4;

    function updateCountdown() {
      let minutes = Math.floor(timeleftSeconds / 60);
      let seconds = Math.abs(timeleftSeconds % 60);
      minutes = minutes < 10 ? '0' + minutes : minutes;
      seconds = seconds < 10 ? '0' + seconds : seconds;
      if (timeleftSeconds > 0 && !countDownFinished) {
        countDown = `${minutes}:${seconds}`;
        timeleftSeconds--;
      } else {
        countDownFinished = true;
        countDown = `-${minutes}:${seconds}`;
        timeleftSeconds++;
      }
    }

    function preload() {
      dvd  = loadImage('bouncink_v2_w200.png');
      pepe = loadImage('pepedance_transparent.gif');
      font = loadFont('DS-DIGIB.TTF');
    }

    function setup() {
      createCanvas(windowWidth, windowHeight);
      x = random(width);
      y = random(height);
      xspeed = textSpeed;
      yspeed = textSpeed;
      textSize(42);
      textFont(font);
      bbox = font.textBounds(countDown);
      textHeight = bbox.h + 6;
      pepe.width  *= pepescale;
      pepe.height *= pepescale;
      colorMode(HSL, 360, 100, 100);
      pickColor();
    }

    function pickColor() { h = random(0, 360); }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    function draw() {
      background(0);
      // neon glow that follows the logo's current colour
      drawingContext.shadowBlur = 34;
      drawingContext.shadowColor = 'hsl(' + h + ', 100%, 60%)';
      tint(h, 100, 70);
      fill(h, 100, 70);
      image(dvd, x, y);
      if (!countDownFinished) {
        text(countDown, x + 58, y + 168);
      } else {
        text(countDown, x + 38, y + 168);
        drawingContext.shadowBlur = 0;
        noTint();
        image(pepe, x + 23, y + 50);
        tint(h, 100, 70);
      }
      drawingContext.shadowBlur = 0;
      x += xspeed;
      y += yspeed;
      let hitX = false, hitY = false;
      if (x + dvd.width >= width)  { xspeed = -xspeed; x = width - dvd.width; hitX = true; }
      else if (x <= 0)              { xspeed = -xspeed; x = 0; hitX = true; }
      if (y + dvd.height + textHeight >= height) { yspeed = -yspeed; y = height - dvd.height - textHeight; hitY = true; }
      else if (y <= 0)              { yspeed = -yspeed; y = 0; hitY = true; }
      if (hitX || hitY) pickColor();
      if (hitX && hitY) { cornerHits++; celebrationFrames = CELEBRATION_DURATION; }

      // corner-hit celebration flash
      if (celebrationFrames > 0) {
        let alpha = celebrationFrames / CELEBRATION_DURATION;
        background(0);
        fill(h, 100, 70, alpha * 80);
        noStroke();
        rect(0, 0, width, height);
        celebrationFrames--;
        // celebration text
        textSize(28);
        fill(h, 100, 90);
        textAlign(CENTER, CENTER);
        text('CORNER HIT!', width / 2, height / 2);
        textSize(42);
        textAlign(LEFT, BASELINE);
      }

      // "will it hit?" proximity counter — distance to nearest corner in bounces
      let distToCornerX = min(x, width - x - dvd.width);
      let distToCornerY = min(y, height - y - dvd.height - textHeight);
      let nearCorner = distToCornerX < CORNER_THRESHOLD * abs(xspeed) &&
                       distToCornerY < CORNER_THRESHOLD * abs(yspeed);
      textSize(14);
      fill(nearCorner ? color(h, 100, 90) : color(255, 255, 255, 120));
      textAlign(RIGHT, BOTTOM);
      text('corners: ' + cornerHits + (nearCorner ? '  ← incoming!' : ''), width - 10, height - 10);
      textSize(42);
      textAlign(LEFT, BASELINE);
    }

    function windowResized() { resizeCanvas(windowWidth, windowHeight); }
  </script>
</head>
<body>

  <!-- Floating UI overlay — always on top of p5 canvas -->
  <div class="bouncink-ui" style="position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;gap:16px;padding:16px 48px;background:linear-gradient(to bottom,rgba(0,0,0,0.55),transparent);">
    <a class="back-link" href="../index.html" style="border-color:rgba(255,255,255,0.25);color:rgba(255,255,255,0.75);background:rgba(0,0,0,0.35);backdrop-filter:blur(8px);">← Home</a>
    <span style="font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;color:rgba(255,255,255,0.8);flex:1;">DVD Bounce</span>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" style="position:static;background:rgba(0,0,0,0.35);backdrop-filter:blur(8px);border-color:rgba(255,255,255,0.25);color:rgba(255,255,255,0.75);">
      <span class="toggle-icon">☀</span>
      <span class="toggle-label">Light</span>
    </button>
  </div>

  <script src="../JS/theme.js"></script>
</body>
</html>

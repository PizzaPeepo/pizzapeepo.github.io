<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bouncink — Canvas Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../CSS/theme.css">
  <style>
    /* p5 canvas fills viewport — keep body clean */
    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
    canvas { display: block; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.1.9/lib/p5.min.js"></script>
  <script>
    let x, y, xspeed, yspeed, dvd, bbox, textHeight, pepe, font;
    let h;
    var pepescale = 0.23;
    const textSpeed = 3;
    const startingMinutes = 0.4;
    let timeleftSeconds = startingMinutes * 60;
    let countDown = '';
    let countDownFinished = false;

    function updateCountdown() {
      let minutes = Math.floor(timeleftSeconds / 60);
      let seconds = Math.abs(timeleftSeconds % 60);
      minutes = minutes < 10 ? '0' + minutes : minutes;
      seconds = seconds < 10 ? '0' + seconds : seconds;
      if (timeleftSeconds > 0 && !countDownFinished) {
        countDown = `${minutes}:${seconds}`;
        timeleftSeconds--;
      } else {
        countDownFinished = true;
        countDown = `-${minutes}:${seconds}`;
        timeleftSeconds++;
      }
    }

    function preload() {
      dvd  = loadImage('bouncink_v2_w200.png');
      pepe = loadImage('pepedance_transparent.gif');
      font = loadFont('DS-DIGIB.TTF');
    }

    function setup() {
      createCanvas(windowWidth, windowHeight);
      x = random(width);
      y = random(height);
      xspeed = textSpeed;
      yspeed = textSpeed;
      textSize(42);
      textFont(font);
      bbox = font.textBounds(countDown);
      textHeight = bbox.h + 6;
      pepe.width  *= pepescale;
      pepe.height *= pepescale;
      colorMode(HSL, 360, 100, 100);
      pickColor();
    }

    function pickColor() { h = random(0, 360); }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    function draw() {
      background(0);
      tint(h, 100, 70);
      fill(h, 100, 70);
      image(dvd, x, y);
      if (!countDownFinished) {
        text(countDown, x + 58, y + 168);
      } else {
        text(countDown, x + 38, y + 168);
        noTint();
        image(pepe, x + 23, y + 50);
        tint(h, 100, 70);
      }
      x += xspeed;
      y += yspeed;
      if (x + dvd.width >= width)  { xspeed = -xspeed; x = width - dvd.width; pickColor(); }
      else if (x <= 0)              { xspeed = -xspeed; x = 0; pickColor(); }
      if (y + dvd.height + textHeight >= height) { yspeed = -yspeed; y = height - dvd.height - textHeight; pickColor(); }
      else if (y <= 0)              { yspeed = -yspeed; y = 0; pickColor(); }
    }

    function windowResized() { resizeCanvas(windowWidth, windowHeight); }
  </script>
</head>
<body>

  <!-- Floating UI overlay — always on top of p5 canvas -->
  <div class="bouncink-ui" style="position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;gap:16px;padding:16px 48px;background:linear-gradient(to bottom,rgba(0,0,0,0.55),transparent);">
    <a class="back-link" href="../index.html" style="border-color:rgba(255,255,255,0.25);color:rgba(255,255,255,0.75);background:rgba(0,0,0,0.35);backdrop-filter:blur(8px);">← Home</a>
    <span style="font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;color:rgba(255,255,255,0.8);flex:1;">Bouncink</span>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" style="position:static;background:rgba(0,0,0,0.35);backdrop-filter:blur(8px);border-color:rgba(255,255,255,0.25);color:rgba(255,255,255,0.75);">
      <span class="toggle-icon">☀</span>
      <span class="toggle-label">Light</span>
    </button>
  </div>

  <script src="../JS/theme.js"></script>
</body>
</html>

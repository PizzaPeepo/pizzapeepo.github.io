<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fourier Epicycles — Canvas Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../CSS/theme.css">
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    #backgroundCanvas { position: fixed; top: 0; left: 0; z-index: 0; cursor: crosshair; }
  </style>
</head>
<body>

  <canvas id="backgroundCanvas"></canvas>

  <!-- Top-left navigation pill -->
  <div class="hud hud-nav">
    <a class="back-link" href="../index.html">← Home</a>
    <h1 class="demo-title">Fourier Epicycles</h1>
    <button class="hud-panel-toggle" id="hudToggle" aria-label="Toggle controls" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/>
      </svg>
    </button>
  </div>

  <div class="hud-panel-backdrop" id="hudBackdrop"></div>

  <!-- Right-side controls panel -->
  <aside class="hud hud-panel" id="hudPanel">

    <div class="hud-panel-header">
      <span class="fps-badge" id="fpsBadge">— fps</span>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span class="toggle-icon">❋</span>
        <span class="toggle-label">Viper</span>
      </button>
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Draw a closed shape on the canvas to redraw it with circles</span>
    </div>

    <div class="hud-divider"></div>

    <details class="hud-details" open>
      <summary>Simulation</summary>
      <div class="hud-section">
        <span class="ctrl-label">Epicycles: <span id="termsValue"></span></span>
        <input type="range" min="1" max="200" step="1" class="slider" id="termsSlider">
      </div>

      <div class="hud-section">
        <span class="ctrl-label">Speed: <span id="speedValue"></span></span>
        <input type="range" min="0.1" max="4" step="0.1" class="slider" id="speedSlider">
      </div>

      <div class="hud-section">
        <span class="ctrl-label">Options</span>
        <label><input type="checkbox" id="circlesCheckbox" checked> Show circles &amp; arms</label>
        <label><input type="checkbox" id="originalCheckbox" checked> Show original path</label>
      </div>
    </details>

    <div class="hud-divider"></div>

    <details class="hud-details">
      <summary>Built-in shapes</summary>
      <div class="hud-section">
        <button data-shape="star">★ Star</button>
        <button data-shape="heart">♥ Heart</button>
        <button data-shape="square">▢ Square</button>
        <button data-shape="pi">π Symbol</button>
      </div>
    </details>

    <div class="hud-divider"></div>

    <div class="hud-section">
      <span class="ctrl-label">Actions</span>
      <button id="pauseButton">Pause (Space)</button>
    </div>

  </aside>

  <script type="module" src="main.js"></script>
  <script src="../JS/theme.js"></script>
  <script src="../JS/hudUtils.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Double Pendulum & Pendulum Wave — Canvas Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../CSS/theme.css">
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    #backgroundCanvas { position: fixed; top: 0; left: 0; z-index: 0; }
    .mode-group[hidden] { display: none; }
  </style>
</head>
<body>

  <canvas id="backgroundCanvas"></canvas>

  <!-- Top-left navigation pill -->
  <div class="hud hud-nav">
    <a class="back-link" href="../index.html">← Home</a>
    <h1 class="demo-title">Double Pendulum</h1>
    <button class="hud-panel-toggle" id="hudToggle" aria-label="Toggle controls" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/>
      </svg>
    </button>
  </div>

  <div class="hud-panel-backdrop" id="hudBackdrop"></div>

  <!-- Right-side controls panel -->
  <aside class="hud hud-panel" id="hudPanel">

    <div class="hud-panel-header">
      <span class="fps-badge" id="fpsBadge">— fps</span>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span class="toggle-icon">☀</span>
        <span class="toggle-label">Light</span>
      </button>
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Mode</span>
      <label><input type="radio" name="mode" value="double" checked> Double pendulum</label>
      <label><input type="radio" name="mode" value="wave"> Pendulum wave</label>
    </div>

    <div class="hud-divider"></div>

    <!-- ── Double-pendulum controls ── -->
    <div class="mode-group" id="doubleControls">
      <div class="hud-section">
        <span class="ctrl-label">Copies: <span id="copiesValue"></span></span>
        <input type="range" min="1" max="40" step="1" class="slider" id="copiesSlider">
      </div>
      <div class="hud-section">
        <span class="ctrl-label">Gravity: <span id="gravityValue"></span></span>
        <input type="range" min="1" max="40" step="0.5" class="slider" id="gravitySlider">
      </div>
      <div class="hud-section">
        <span class="ctrl-label">Damping: <span id="dampingValue"></span></span>
        <input type="range" min="0" max="0.5" step="0.005" class="slider" id="dampingSlider">
      </div>
      <div class="hud-section">
        <span class="ctrl-label">Arm 2 length: <span id="arm2Value"></span></span>
        <input type="range" min="0.4" max="1.4" step="0.05" class="slider" id="arm2Slider">
      </div>
      <div class="hud-section">
        <span class="ctrl-label">Options</span>
        <label><input type="checkbox" id="trailCheckbox" checked> Trace 2nd bob</label>
        <label><input type="checkbox" id="rodsCheckbox" checked> Show rods</label>
      </div>
      <div class="hud-section">
        <span class="ctrl-label">Trail fade: <span id="fadeSpeedValue"></span>%</span>
        <input type="range" min="1" max="30" step="1" class="slider" id="fadeSpeedSlider">
      </div>
    </div>

    <!-- ── Pendulum-wave controls ── -->
    <div class="mode-group" id="waveControls" hidden>
      <div class="hud-section">
        <span class="ctrl-label">Pendulums: <span id="waveCountValue"></span></span>
        <input type="range" min="5" max="60" step="1" class="slider" id="waveCountSlider">
      </div>
      <div class="hud-section">
        <span class="ctrl-label">Cycle period: <span id="periodValue"></span>s</span>
        <input type="range" min="10" max="60" step="1" class="slider" id="periodSlider">
      </div>
      <div class="hud-section">
        <span class="ctrl-label">Amplitude: <span id="amplitudeValue"></span>°</span>
        <input type="range" min="5" max="60" step="1" class="slider" id="amplitudeSlider">
      </div>
    </div>

    <div class="hud-divider"></div>

    <div class="hud-section">
      <span class="ctrl-label">Actions</span>
      <button id="pauseButton">Pause (Space)</button>
      <button id="resetButton">Reset (R)</button>
      <button id="exportButton">Save PNG (S)</button>
    </div>

  </aside>

  <script type="module" src="main.js"></script>
  <script src="../JS/theme.js"></script>
  <script src="../JS/hudUtils.js"></script>
</body>
</html>

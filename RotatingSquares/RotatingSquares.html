<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotating Polygons — Canvas Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../CSS/theme.css">
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    #backgroundCanvas { position: fixed; top: 0; left: 0; z-index: 0; }
  </style>
</head>
<body>

  <canvas id="backgroundCanvas"></canvas>

  <!-- Top-left navigation pill -->
  <div class="hud hud-nav">
    <a class="back-link" href="../index.html">← Home</a>
    <h1 class="demo-title">Rotating Polygons</h1>
    <button class="hud-panel-toggle" id="hudToggle" aria-label="Toggle controls" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/>
      </svg>
    </button>
  </div>

  <div class="hud-panel-backdrop" id="hudBackdrop"></div>

  <!-- Right-side controls panel -->
  <aside class="hud hud-panel" id="hudPanel">

    <div class="hud-panel-header">
      <span class="fps-badge" id="fpsBadge">— fps</span>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span class="toggle-icon">☀</span>
        <span class="toggle-label">Light</span>
      </button>
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Rotation speed: <span id="rotationSpeedValue"></span></span>
      <input type="range" min="0.0001" max="0.01" step="0.0001" class="slider" id="rotationSpeedSlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Polygon count: <span id="polygonCountValue"></span></span>
      <input type="range" min="2" max="30" step="1" class="slider" id="polygonCountSlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Sides: <span id="sidesValue"></span></span>
      <input type="range" min="3" max="12" step="1" class="slider" id="sidesSlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Base color: <span id="baseColorValue"></span></span>
      <input type="range" min="0" max="360" step="1" class="slider" id="baseColorSlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Fade trail speed: <span id="fadeSpeedValue"></span>%</span>
      <input type="range" min="0.01" max="0.3" step="0.01" class="slider" id="fadeSpeedSlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Options</span>
      <label><input type="checkbox" id="rainbowColorCheckbox"> Rainbow colors</label>
      <label><input type="checkbox" id="trailCheckbox"> Fade trail</label>
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Actions</span>
      <button id="pauseButton">Pause (Space)</button>
      <button id="resetCanvasButton">Reset (R)</button>
    </div>

  </aside>

  <script type="module" src="main.js"></script>
  <script src="../JS/theme.js"></script>
  <script src="../JS/hudUtils.js"></script>
</body>
</html>

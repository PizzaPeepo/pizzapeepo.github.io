<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotating Squares — Canvas Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../CSS/theme.css">
</head>
<body>

  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
    <span class="toggle-icon">☀</span>
    <span class="toggle-label">Light</span>
  </button>

  <div class="blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="page">

    <div class="topbar">
      <a class="back-link" href="../index.html">← Home</a>
      <h1 class="demo-title">Rotating Squares</h1>
    </div>

    <div class="controls">
      <div class="ctrl-group">
        <span class="ctrl-label">Rotation speed: <span id="rotationSpeedValue"></span></span>
        <input type="range" min="0.0001" max="0.01" step="0.0001" class="slider" id="rotationSpeedSlider">
      </div>
      <div class="ctrl-group">
        <span class="ctrl-label">Square count: <span id="squareCountValue"></span></span>
        <input type="range" min="2" max="30" step="1" class="slider" id="squareCountSlider">
      </div>
      <div class="ctrl-group">
        <span class="ctrl-label">Base color: <span id="baseColorValue"></span></span>
        <input type="range" min="0" max="360" step="1" class="slider" id="baseColorSlider">
      </div>
      <div class="ctrl-group">
        <span class="ctrl-label">Options</span>
        <label><input type="checkbox" id="rainbowColorCheckbox"> Rainbow colors</label>
      </div>
      <div class="ctrl-group">
        <span class="ctrl-label">Actions</span>
        <button id="resetCanvasButton">Reset canvas</button>
      </div>
    </div>

    <div class="canvas-wrap" style="--cw:800px;--ch:800px;">
      <canvas id="backgroundCanvas"></canvas>
    </div>

  </div>

  <script type="module" src="main.js"></script>
  <script src="../JS/theme.js"></script>
</body>
</html>

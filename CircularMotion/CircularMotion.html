<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circular Motion — Canvas Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../CSS/theme.css">
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    body { background: #18140e; }
    #backgroundCanvas, #middlegroundCanvas, #foregroundCanvas {
      position: fixed; top: 0; left: 0; z-index: 0;
    }
  </style>
</head>
<body>

  <canvas id="backgroundCanvas"></canvas>
  <canvas id="middlegroundCanvas"></canvas>
  <canvas id="foregroundCanvas"></canvas>

  <!-- Top-left navigation pill -->
  <div class="hud hud-nav">
    <a class="back-link" href="../index.html">← Home</a>
    <h1 class="demo-title">Circular Motion</h1>
    <button class="hud-panel-toggle" id="hudToggle" aria-label="Toggle controls" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/>
      </svg>
    </button>
  </div>

  <div class="hud-panel-backdrop" id="hudBackdrop"></div>

  <!-- Right-side controls panel -->
  <aside class="hud hud-panel" id="hudPanel">

    <div class="hud-panel-header">
      <span class="fps-badge" id="fpsBadge">— fps</span>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span class="toggle-icon">☀</span>
        <span class="toggle-label">Light</span>
      </button>
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Points: <span id="pointCountValue"></span></span>
      <input type="range" min="1" max="280" step="1" class="slider" id="pointCountSlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Velocity: <span id="drawingSpeedValue"></span></span>
      <input type="range" min="0.0001" max="0.01" step="0.0001" class="slider" id="drawingSpeedSlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Fade speed: <span id="fadeAwaySpeedValue"></span></span>
      <input type="range" min="0.01" max="0.1" step="0.001" class="slider" id="fadeAwaySpeedSlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Multiplier: <span id="multiplierValue"></span></span>
      <input type="range" min="0.1" max="5" step="0.01" class="slider" id="multiplierSlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Star step: <span id="starStepValue"></span></span>
      <input type="range" min="1" max="20" step="1" class="slider" id="starStepSlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Options</span>
      <label><input type="radio" name="colorMode" value="angle" checked> Color by angle</label>
      <label><input type="radio" name="colorMode" value="radius"> Color by radius</label>
      <label><input type="checkbox" id="fadeAwayCheckbox"> Enable fade-away</label>
      <label><input type="checkbox" id="liveResetCheckbox"> Live canvas reset</label>
      <label><input type="checkbox" id="showWhiteLinesCheckbox"> Show white lines</label>
      <label><input type="checkbox" id="showBlackBorderAroundPointsCheckbox"> Black border on points</label>
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Actions</span>
      <button id="pauseButton">Pause (Space)</button>
      <button id="resetCanvasButton">Reset canvas (R)</button>
      <p style="font-size:0.75em;opacity:0.6;margin:6px 0 0">Drag canvas to move origin</p>
    </div>

  </aside>

  <script type="module" src="main.js"></script>
  <script src="../JS/theme.js"></script>
  <script src="../JS/hudUtils.js"></script>
</body>
</html>

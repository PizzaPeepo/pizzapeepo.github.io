<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotating Lissajous — Canvas Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../CSS/theme.css">
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    #backgroundCanvas, #foregroundCanvas { position: fixed; top: 0; left: 0; z-index: 0; }
  </style>
</head>
<body>

  <canvas id="backgroundCanvas"></canvas>
  <canvas id="foregroundCanvas"></canvas>

  <!-- Top-left navigation pill -->
  <div class="hud hud-nav">
    <a class="back-link" href="../index.html">← Home</a>
    <h1 class="demo-title">Rotating Lissajous</h1>
  </div>

  <!-- Right-side controls panel -->
  <aside class="hud hud-panel" id="hudPanel">

    <div class="hud-panel-header">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span class="toggle-icon">☀</span>
        <span class="toggle-label">Light</span>
      </button>
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Omega 1: <span id="omega1Value"></span></span>
      <input type="range" min="1" max="20" step="0.1" class="slider" id="omega1Slider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Omega 2: <span id="omega2Value"></span></span>
      <input type="range" min="1" max="20" step="0.1" class="slider" id="omega2Slider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Delta phaseshift: <span id="phaseshiftValue"></span></span>
      <input type="range" min="0.001" max="0.1" step="0.001" class="slider" id="phaseshiftSlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Fade speed: <span id="fadeAwaySpeedValue"></span></span>
      <input type="range" min="0.001" max="0.3" step="0.001" class="slider" id="fadeAwaySpeedSlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Options</span>
      <label><input type="checkbox" id="fadeAwayCheckbox"> Enable fade-away</label>
      <label><input type="checkbox" id="liveResetCheckbox"> Live canvas reset</label>
    </div>

    <div class="hud-section">
      <span class="ctrl-label">ω₁ : ω₂ = <span id="ratioReadout">1 : 4</span></span>
      <span class="ctrl-label">Phase: <span id="phaseReadout">0.0°</span></span>
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Actions</span>
      <button id="resetCanvasButton">Reset canvas</button>
    </div>

  </aside>

  <script type="module" src="./main.js"></script>
  <script src="../JS/theme.js"></script>
</body>
</html>

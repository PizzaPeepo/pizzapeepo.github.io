<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raycaster — Canvas Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../CSS/theme.css">
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    #myCanvas { position: fixed; top: 0; left: 0; z-index: 0; }
    .ctrl-hint {
      font-size: 11px;
      color: var(--tx-3);
      line-height: 1.5;
      margin: 0;
    }
    #drawWallToggle.active {
      color: var(--gold);
      border-color: var(--gold);
      background: var(--gold-tint);
    }
  </style>
</head>
<body>

  <canvas id="myCanvas"></canvas>

  <!-- Top-left navigation pill -->
  <div class="hud hud-nav">
    <a class="back-link" href="../index.html">← Home</a>
    <h1 class="demo-title">Raycaster</h1>
  </div>

  <!-- Right-side controls panel -->
  <aside class="hud hud-panel" id="hudPanel">

    <div class="hud-panel-header">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span class="toggle-icon">☀</span>
        <span class="toggle-label">Light</span>
      </button>
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Rays: <span id="rayCountValue"></span></span>
      <input type="range" min="1" max="600" value="200" class="slider" id="rayCountSlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Walls: <span id="wallCountValue"></span></span>
      <input type="range" min="1" max="20" class="slider" id="wallCountSlider">
    </div>

    <div class="hud-divider"></div>

    <div class="hud-section">
      <span class="ctrl-label">Auto-regen: <span id="autoRegenStatus">Off</span></span>
      <button id="autoRegenToggle">Turn On</button>
      <span class="ctrl-label" style="margin-top:4px">Interval: <span id="regenIntervalValue">15 </span>s</span>
      <input type="range" min="1" max="30" value="5" class="slider" id="regenIntervalSlider">
    </div>

    <div class="hud-section">
      <button id="newWallsBtn">New Walls</button>
    </div>

    <div class="hud-divider"></div>

    <div class="hud-section">
      <button id="drawWallToggle" class="active">Draw Wall: On</button>
      <p class="ctrl-hint">Drag on canvas to add a wall.<br>Right-click a wall to remove it.</p>
    </div>

  </aside>

  <script src="../Utils/simplexNoise.js"></script>
  <script type="module" src="./main.js"></script>
  <script src="../JS/theme.js"></script>
</body>
</html>

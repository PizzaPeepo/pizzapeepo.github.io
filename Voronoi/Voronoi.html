<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voronoi / Delaunay — Canvas Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../CSS/theme.css">
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    #backgroundCanvas { position: fixed; top: 0; left: 0; z-index: 0; cursor: crosshair; }
  </style>
</head>
<body>

  <canvas id="backgroundCanvas"></canvas>

  <!-- Top-left navigation pill -->
  <div class="hud hud-nav">
    <a class="back-link" href="../index.html">← Home</a>
    <h1 class="demo-title">Voronoi / Delaunay</h1>
    <button class="hud-panel-toggle" id="hudToggle" aria-label="Toggle controls" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/>
      </svg>
    </button>
  </div>

  <div class="hud-panel-backdrop" id="hudBackdrop"></div>

  <!-- Right-side controls panel -->
  <aside class="hud hud-panel" id="hudPanel">

    <div class="hud-panel-header">
      <span class="fps-badge" id="fpsBadge">— fps</span>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span class="toggle-icon">❋</span>
        <span class="toggle-label">Viper</span>
      </button>
    </div>

    <div class="hud-section">
      <span class="ctrl-label" id="hintLabel">Click to add a site · right-click removes the nearest</span>
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Mode</span>
      <label><input type="radio" name="mode" value="drift" checked> Drifting sites</label>
      <label><input type="radio" name="mode" value="grow"> Flood fill</label>
    </div>


    <details class="hud-details" open>
      <summary>Simulation</summary>
      <div class="hud-section">
        <span class="ctrl-label">Sites: <span id="countValue"></span></span>
        <input type="range" min="3" max="120" step="1" class="slider" id="countSlider">
      </div>

      <div class="hud-section">
        <span class="ctrl-label">Motion: <span id="speedValue"></span></span>
        <input type="range" min="0" max="3" step="0.05" class="slider" id="speedSlider">
      </div>

      <div class="hud-section">
        <span class="ctrl-label">Growth speed: <span id="growValue"></span></span>
        <input type="range" min="0.05" max="2" step="0.05" class="slider" id="growSlider">
      </div>
    </details>


    <details class="hud-details">
      <summary>Display</summary>
      <div class="hud-section">
        <span class="ctrl-label">View</span>
        <label><input type="radio" name="view" value="cells" checked> Voronoi cells</label>
        <label><input type="radio" name="view" value="delaunay"> Delaunay mesh</label>
        <label><input type="radio" name="view" value="both"> Both</label>
      </div>

      <div class="hud-section">
        <span class="ctrl-label">Options</span>
        <label><input type="checkbox" id="pointsCheckbox" checked> Show site points</label>
        <label><input type="checkbox" id="asciiCheckbox" checked> ASCII flood texture</label>
      </div>
    </details>


    <div class="hud-section">
      <span class="ctrl-label">Actions</span>
      <button id="resetButton">Reset (R)</button>
      <button id="growButton">Grow (G)</button>
      <button id="clearButton">Clear</button>
      <button id="pauseButton">Pause (Space)</button>
    </div>

  </aside>

  <script type="module" src="main.js"></script>
  <script src="../JS/theme.js"></script>
  <script src="../JS/hudUtils.js"></script>
</body>
</html>

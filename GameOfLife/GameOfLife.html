<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game of Life — Canvas Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../CSS/theme.css">
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    #backgroundCanvas { position: fixed; top: 0; left: 0; z-index: 0; cursor: crosshair; }
    .btn-row { display: flex; gap: 6px; }
    .btn-row button { flex: 1; }
  </style>
</head>
<body>

  <canvas id="backgroundCanvas"></canvas>

  <!-- Top-left navigation pill -->
  <div class="hud hud-nav">
    <a class="back-link" href="../index.html">← Home</a>
    <h1 class="demo-title">Game of Life</h1>
    <button class="hud-panel-toggle" id="hudToggle" aria-label="Toggle controls" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/>
      </svg>
    </button>
  </div>

  <div class="hud-panel-backdrop" id="hudBackdrop"></div>

  <!-- Right-side controls panel -->
  <aside class="hud hud-panel" id="hudPanel">

    <div class="hud-panel-header">
      <span class="fps-badge" id="fpsBadge">— gen</span>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span class="toggle-icon">❋</span>
        <span class="toggle-label">Viper</span>
      </button>
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Draw to paint cells · right-click erases</span>
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Cell size: <span id="cellValue"></span>px</span>
      <input type="range" min="3" max="24" step="1" class="slider" id="cellSlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Speed: <span id="speedValue"></span> gen/s</span>
      <input type="range" min="1" max="60" step="1" class="slider" id="speedSlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Random density: <span id="densityValue"></span>%</span>
      <input type="range" min="5" max="70" step="1" class="slider" id="densitySlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Options</span>
      <label><input type="checkbox" id="wrapCheckbox" checked> Wrap edges</label>
      <label><input type="checkbox" id="gridCheckbox"> Show grid</label>
      <label><input type="checkbox" id="ageCheckbox" checked> Colour by age</label>
    </div>

    <div class="hud-divider"></div>

    <div class="hud-section">
      <span class="ctrl-label">Patterns</span>
      <div class="btn-row">
        <button id="randomButton">Random</button>
        <button id="clearButton">Clear</button>
      </div>
      <button id="gliderGunButton">Gosper glider gun</button>
      <div class="btn-row">
        <button id="pulsarButton">Pulsar</button>
        <button id="pentaButton">Pentadecathlon</button>
      </div>
    </div>

    <div class="hud-divider"></div>

    <div class="hud-section">
      <span class="ctrl-label">Actions</span>
      <button id="pauseButton">Pause (Space)</button>
      <button id="stepButton">Step (→)</button>
    </div>

  </aside>

  <script type="module" src="main.js"></script>
  <script src="../JS/theme.js"></script>
  <script src="../JS/hudUtils.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lissajous Figures — Canvas Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../CSS/theme.css">
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    #backgroundCanvas, #foregroundCanvas { position: fixed; top: 0; left: 0; z-index: 0; }
  </style>
</head>
<body>

  <canvas id="backgroundCanvas"></canvas>
  <canvas id="foregroundCanvas"></canvas>

  <!-- Top-left navigation pill -->
  <div class="hud hud-nav">
    <a class="back-link" href="../index.html">← Home</a>
    <h1 class="demo-title">Lissajous Figures</h1>
    <button class="hud-panel-toggle" id="hudToggle" aria-label="Toggle controls" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/>
      </svg>
    </button>
  </div>

  <div class="hud-panel-backdrop" id="hudBackdrop"></div>

  <!-- Right-side controls panel -->
  <aside class="hud hud-panel" id="hudPanel">

    <div class="hud-panel-header">
      <span class="fps-badge" id="fpsBadge">— fps</span>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span class="toggle-icon">☀</span>
        <span class="toggle-label">Light</span>
      </button>
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Figure size: <span id="figureSizeValue"></span></span>
      <input type="range" min="10" max="400" step="5" class="slider" id="figureSizeSlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Drawing speed: <span id="drawingSpeedValue"></span></span>
      <input type="range" min="0.001" max="0.1" step="0.001" class="slider" id="drawingSpeedSlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Fade speed: <span id="fadeAwaySpeedValue"></span></span>
      <input type="range" min="0.01" max="0.1" step="0.001" class="slider" id="fadeAwaySpeedSlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Options</span>
      <label><input type="checkbox" id="fadeAwayCheckbox"> Enable fade-away</label>
      <label><input type="checkbox" id="liveResetCheckbox"> Live canvas reset</label>
      <label><input type="checkbox" id="showLinesCheckbox" checked> Show projection lines</label>
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Actions</span>
      <button id="pauseButton">Pause (Space)</button>
      <button id="resetCanvasButton">Reset canvas (R)</button>
      <button id="exportButton">Save PNG (S)</button>
    </div>

  </aside>

  <script type="module" src="./main.js"></script>
  <script src="../JS/theme.js"></script>
  <script src="../JS/hudUtils.js"></script>
</body>
</html>

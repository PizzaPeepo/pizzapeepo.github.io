<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flocking (Boids) — Canvas Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../CSS/theme.css">
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    #backgroundCanvas { position: fixed; top: 0; left: 0; z-index: 0; }
  </style>
</head>
<body>

  <canvas id="backgroundCanvas"></canvas>

  <!-- Top-left navigation pill -->
  <div class="hud hud-nav">
    <a class="back-link" href="../index.html">← Home</a>
    <h1 class="demo-title">Flocking</h1>
    <button class="hud-panel-toggle" id="hudToggle" aria-label="Toggle controls" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/>
      </svg>
    </button>
  </div>

  <div class="hud-panel-backdrop" id="hudBackdrop"></div>

  <!-- Right-side controls panel -->
  <aside class="hud hud-panel" id="hudPanel">

    <div class="hud-panel-header">
      <span class="fps-badge" id="fpsBadge">— fps</span>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span class="toggle-icon">☀</span>
        <span class="toggle-label">Light</span>
      </button>
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Boids: <span id="countValue"></span></span>
      <input type="range" min="50" max="1200" step="10" class="slider" id="countSlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Separation: <span id="separationValue"></span></span>
      <input type="range" min="0" max="3" step="0.05" class="slider" id="separationSlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Alignment: <span id="alignmentValue"></span></span>
      <input type="range" min="0" max="3" step="0.05" class="slider" id="alignmentSlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Cohesion: <span id="cohesionValue"></span></span>
      <input type="range" min="0" max="3" step="0.05" class="slider" id="cohesionSlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Perception: <span id="perceptionValue"></span></span>
      <input type="range" min="20" max="120" step="1" class="slider" id="perceptionSlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Max speed: <span id="speedValue"></span></span>
      <input type="range" min="1" max="8" step="0.1" class="slider" id="speedSlider">
    </div>

    <div class="hud-divider"></div>

    <div class="hud-section">
      <span class="ctrl-label">Mouse force</span>
      <label><input type="radio" name="mouseMode" value="off" checked> Off</label>
      <label><input type="radio" name="mouseMode" value="attract"> Attract</label>
      <label><input type="radio" name="mouseMode" value="repel"> Repel</label>
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Options</span>
      <label><input type="checkbox" id="trailCheckbox" checked> Motion trails</label>
      <label><input type="checkbox" id="colorCheckbox" checked> Colour by speed</label>
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Fade trail speed: <span id="fadeSpeedValue"></span>%</span>
      <input type="range" min="2" max="40" step="1" class="slider" id="fadeSpeedSlider">
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Actions</span>
      <button id="pauseButton">Pause (Space)</button>
      <button id="resetButton">Reset (R)</button>
      <button id="exportButton">Save PNG (S)</button>
    </div>

  </aside>

  <script type="module" src="main.js"></script>
  <script src="../JS/theme.js"></script>
  <script src="../JS/hudUtils.js"></script>
</body>
</html>

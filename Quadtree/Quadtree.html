<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quadtree — Canvas Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../CSS/theme.css">
</head>
<body>

  <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
    <span class="toggle-icon">☀</span>
    <span class="toggle-label">Light</span>
  </button>

  <div class="blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="page">

    <div class="topbar">
      <a class="back-link" href="../index.html">← Home</a>
      <h1 class="demo-title">Quadtree</h1>
    </div>

    <div class="controls">
      <div class="ctrl-group">
        <span class="ctrl-label">Actions</span>
        <button id="resetCanvasButton">Reset canvas</button>
      </div>
    </div>

    <div class="canvas-wrap" style="--cw:800px;--ch:800px;">
      <canvas id="backgroundCanvas"></canvas>
      <canvas id="foregroundCanvas"></canvas>
    </div>

  </div>

  <script type="module" src="main.js"></script>
  <script src="../JS/theme.js"></script>
</body>
</html>

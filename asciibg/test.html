<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>asciibg test harness</title>
	<link rel="stylesheet" href="../CSS/theme.css">
	<style>
		html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0b14; }
		#asciibgCanvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
		#hud { position: fixed; top: 10px; left: 10px; z-index: 10; font: 12px monospace; color: #888; }
		#hud button { font: inherit; margin-right: 6px; }
		/* heat / heatrev dye inks + field (copied from index.html; theme.css
		   doesn't carry these trial themes). theme-palette.js reads them. */
		html.heat {
			--bg: #01030c;
			--gold-hi: #00e0ff; --gold: #ffd000;
			--coral-hi: #2a6bff; --coral: #ff3000;
		}
		html.heatrev {
			--bg: #0c0200;
			--gold-hi: #baf0ff; --gold: #00e0ff;
			--coral-hi: #0030c0; --coral: #2a6bff;
		}
	</style>
</head>
<body>
	<canvas id="asciibgCanvas"></canvas>
	<div id="hud">
		<button id="btnTheme">theme</button>
		<span id="stat"></span>
	</div>
	<!-- Phase 5 hover-repulsion target; ?hover=1 fakes a mouseover on it. -->
	<div id="hoverProbe" class="card" style="position:fixed;left:30%;top:35%;width:260px;height:200px;z-index:5;border:1px solid #666;border-radius:12px;background:rgba(20,20,30,0.35);"></div>
	<script type="module" src="./test-main.js"></script>
</body>
</html>

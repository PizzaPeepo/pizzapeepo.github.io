<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pong Wars — Canvas Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../CSS/theme.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500..800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; }
    #backgroundCanvas { position: fixed; z-index: 0; }

    /* text + number inputs inside the HUD panel */
    .hud-panel input[type="text"],
    .hud-panel input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg-lift, #2c2116);
      border: 1px solid var(--tx-4, #3a2210);
      border-radius: 8px;
      color: var(--tx, #f5e8d4);
      font-family: inherit;
      font-size: 13px;
      padding: 6px 9px;
      margin-top: 4px;
    }
    .hud-panel input[type="text"]:focus,
    .hud-panel input[type="number"]:focus { outline: none; border-color: var(--gold, #f5a623); }
    .pw-size-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
    .pw-size-row input[type="number"] { width: 72px; margin-top: 0; text-align: center; }
    .pw-size-row span { color: var(--tx-2, #8a6a50); font-size: 13px; flex: 0 0 auto; }
    .pw-btn-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .pw-btn-row button { flex: 1 1 calc(50% - 6px); }
    .pw-pu-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .pw-pu-label { flex: 0 0 92px; font-size: 13px; color: var(--tx-2, #8a6a50); }
    .pw-pu-btns { display: flex; gap: 5px; flex: 1; }
    .pw-pu-btn { flex: 1; min-width: 30px; padding: 5px 0; font-size: 13px; font-weight: 700; cursor: pointer; background: transparent; border: 1.5px solid currentColor; border-radius: 6px; opacity: 0.82; transition: opacity 0.15s, background 0.15s; }
    .pw-pu-btn:hover { opacity: 1; background: rgba(127,127,127,0.12); }
    @keyframes pw-leadflash { 0% { transform: scale(1.2); filter: brightness(1.7); } 100% { transform: scale(1); filter: brightness(1); } }
    .pw-chip.pw-leadflash { animation: pw-leadflash 0.5s ease; }

    /* per-team name + colour controls (built by main.js) */
    .pw-team-row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
    .pw-team-row input[type="color"] {
      width: 34px; height: 30px; border: none; border-radius: 6px;
      background: none; cursor: pointer; padding: 0; flex: 0 0 auto;
    }
    .pw-team-row input[type="text"] { margin-top: 0; }
    .pw-count-row { display: flex; gap: 6px; }
    .pw-count-row label {
      flex: 1; text-align: center; font-size: 13px; cursor: pointer;
      padding: 5px 0; border-radius: 7px;
      background: var(--bg-lift, #2c2116); border: 1px solid var(--tx-4, #3a2210);
    }
    .pw-count-row input { position: absolute; opacity: 0; pointer-events: none; }
    .pw-count-row label:has(input:checked) { border-color: var(--gold, #f5a623); color: var(--gold, #f5a623); }

    /* ── Scoreboard (top-centre, stream-readable) ── */
    .pw-scoreboard {
      position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
      z-index: 30; pointer-events: none;
      display: flex; flex-direction: column; align-items: stretch; gap: 9px;
      width: min(620px, 86vw);
      font-family: 'Fraunces', Georgia, serif;
      padding: 12px 18px;
      background: rgba(0,0,0,0.32);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 22px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.35);
      transition: opacity 0.3s ease;
    }
    html.light .pw-scoreboard { background: rgba(255,255,255,0.45); border-color: rgba(0,0,0,0.10); }
    .pw-scoreboard.pw-hidden { opacity: 0; }
    .pw-bar {
      width: 100%; height: 14px; border-radius: 8px; overflow: hidden;
      display: flex; box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
    }
    .pw-bar > div { height: 100%; transition: width 0.25s linear; }
    .pw-legend {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 5px 16px;
    }
    .pw-chip {
      display: flex; align-items: center; gap: 6px;
      font-size: 15px; font-weight: 700; color: #fff; white-space: nowrap;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }
    html.light .pw-chip { color: #1a1008; text-shadow: none; }
    .pw-chip .pw-pct { font-variant-numeric: tabular-nums; opacity: 0.92; }
    .pw-dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; box-shadow: 0 0 8px rgba(0,0,0,0.4); }
    .pw-chip { padding: 2px 9px; border-radius: 7px; transition: background 0.25s ease, transform 0.2s ease; }
    .pw-chip.pw-lead { transform: scale(1.06); background: rgba(255,255,255,0.08); }
    html.light .pw-chip.pw-lead { background: rgba(0,0,0,0.07); }
    body.neon .pw-chip.pw-lead { background: rgba(0,234,255,0.12); box-shadow: 0 0 14px rgba(0,234,255,0.28), inset 0 0 8px rgba(0,234,255,0.1); }
    body.neon .pw-chip.pw-lead .pw-cname { color: #ffffff; text-shadow: 0 0 10px rgba(0,234,255,0.85); }

    /* ── "Starting soon" overlay ── */
    .pw-overlay {
      position: fixed; inset: 0; z-index: 20; pointer-events: none;
      display: flex; align-items: center; justify-content: center;
      text-align: center;
      opacity: 0; transition: opacity 0.5s ease;
    }
    .pw-overlay.pw-show { opacity: 1; }
    .pw-overlay-card {
      padding: 44px 64px;
      background: rgba(0,0,0,0.38);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 22px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }
    .pw-overlay-title {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 800; font-size: clamp(40px, 7vw, 92px);
      line-height: 1; color: #fff; letter-spacing: -0.02em;
      text-shadow: 0 4px 24px rgba(0,0,0,0.55);
    }
    .pw-overlay-sub {
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: clamp(15px, 2vw, 22px); color: rgba(255,255,255,0.82);
      margin-top: 18px; letter-spacing: 0.02em;
    }

    /* ── Event banner (transient toast for chat events) ── */
    .pw-banner {
      position: fixed; top: 110px; left: 50%; transform: translateX(-50%) translateY(-14px);
      z-index: 60; pointer-events: none;
      font-family: 'DM Sans', system-ui, sans-serif;
      font-weight: 600; font-size: 19px; color: #fff;
      padding: 12px 26px; border-radius: 40px;
      background: linear-gradient(90deg, var(--gold, #f5a623), var(--coral, #ff6b47));
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease;
      white-space: nowrap;
    }
    .pw-banner.pw-show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* screen shake for hype moments */
    @keyframes pw-shake {
      0%,100% { transform: translate(0,0); }
      20% { transform: translate(-6px, 3px); }
      40% { transform: translate(5px, -4px); }
      60% { transform: translate(-4px, -3px); }
      80% { transform: translate(4px, 3px); }
    }
    #backgroundCanvas.pw-shaking { animation: pw-shake 0.5s ease; }

    /* ── Neo-Tokyo post FX (pure CSS, zero per-frame cost) ── */
    .pw-fx { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
    .pw-vignette { background: radial-gradient(120% 120% at 50% 42%, transparent 52%, rgba(0,0,0,0.55) 100%); }
    .pw-scanlines {
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px);
      mix-blend-mode: overlay; opacity: 0.5;
    }
    body:not(.neon) .pw-fx, html.light .pw-fx { display: none; }
    body.crt-off .pw-fx { display: none; }

    /* ── Neo-Tokyo scoreboard skin (neon mode only) ── */
    body.neon .pw-scoreboard {
      font-family: 'Orbitron', ui-sans-serif, system-ui, sans-serif;
      background: linear-gradient(165deg, rgba(11,14,32,0.74), rgba(7,7,18,0.8));
      border: 1px solid rgba(0,234,255,0.42);
      border-radius: 3px;
      box-shadow: 0 0 0 1px rgba(255,43,209,0.10), 0 0 22px rgba(0,234,255,0.22), inset 0 0 20px rgba(0,234,255,0.05);
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
    }
    body.neon .pw-bar {
      border-radius: 2px;
      border: 1px solid rgba(0,234,255,0.25);
      background: rgba(0,0,0,0.55);
      box-shadow: inset 0 0 8px rgba(0,0,0,0.85), 0 0 10px rgba(0,234,255,0.2);
    }
    body.neon .pw-bar > div { filter: saturate(1.35) brightness(1.12); }
    body.neon .pw-chip {
      font-weight: 600; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase;
      color: #d8f7ff; text-shadow: 0 0 6px rgba(0,234,255,0.45);
    }
    body.neon .pw-pct { color: #00eaff; text-shadow: 0 0 7px rgba(0,234,255,0.7); }
    body.neon .pw-dot { border-radius: 1px; }

    /* ── Neo-Tokyo game-area frame ── */
    .pw-frame { position: fixed; z-index: 6; pointer-events: none; box-sizing: border-box; }
    body:not(.neon) .pw-frame { border: 1px solid rgba(128,128,128,0.22); border-radius: 4px; }
    body.neon .pw-frame {
      border: 1px solid rgba(0,234,255,0.45); border-radius: 5px;
      box-shadow: 0 0 18px rgba(0,234,255,0.22), inset 0 0 26px rgba(0,234,255,0.05), 0 0 0 3px rgba(255,43,209,0.10);
    }
  </style>
</head>
<body>

  <canvas id="backgroundCanvas"></canvas>

  <!-- Neo-Tokyo game-area frame (border + corner brackets) -->
  <div class="pw-frame" id="pwFrame"></div>

  <!-- Neo-Tokyo post FX overlays (CSS only) -->
  <div class="pw-fx pw-vignette"></div>
  <div class="pw-fx pw-scanlines"></div>

  <!-- Stream scoreboard (segments + legend built by main.js) -->
  <div class="pw-scoreboard" id="pwScore"></div>

  <!-- Waiting-screen overlay -->
  <div class="pw-overlay" id="pwOverlay">
    <div class="pw-overlay-card">
      <div class="pw-overlay-title" id="pwTitle">Starting Soon</div>
      <div class="pw-overlay-sub" id="pwSub">Stream begins shortly — drop a follow while you wait!</div>
    </div>
  </div>

  <!-- Event banner -->
  <div class="pw-banner" id="pwBanner"></div>

  <!-- Top-left navigation pill -->
  <div class="hud hud-nav">
    <a class="back-link" href="../index.html">← Home</a>
    <h1 class="demo-title">Pong Wars</h1>
    <button class="hud-panel-toggle" id="hudToggle" aria-label="Toggle controls" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/>
      </svg>
    </button>
  </div>

  <div class="hud-panel-backdrop" id="hudBackdrop"></div>

  <!-- Right-side controls panel -->
  <aside class="hud hud-panel" id="hudPanel">

    <div class="hud-panel-header">
      <span class="fps-badge" id="fpsBadge">— fps</span>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span class="toggle-icon">❋</span>
        <span class="toggle-label">Viper</span>
      </button>
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Teams</span>
      <div class="pw-count-row">
        <label><input type="radio" name="teamcount" value="2" checked> 2</label>
        <label><input type="radio" name="teamcount" value="3"> 3</label>
        <label><input type="radio" name="teamcount" value="4"> 4</label>
      </div>
    </div>

    <div class="hud-section">
      <span class="ctrl-label">Actions</span>
      <button id="pauseButton">Pause (Space)</button>
      <button id="newButton">Re-launch balls (N)</button>
      <button id="resetButton">Reset (R)</button>
      <button id="endButton">End round</button>
    </div>

    <div class="hud-divider"></div>

    <details class="hud-details" open>
      <summary>Appearance</summary>

      <div class="hud-section">
        <span class="ctrl-label">Colour theme</span>
        <label><input type="radio" name="preset" value="neon" checked> Neon</label>
        <label><input type="radio" name="preset" value="mono"> Monochrome</label>
        <label><input type="radio" name="preset" value="geoblue"> Geometric Neon Blue</label>
        <label><input type="radio" name="preset" value="lights"> Lights</label>
        <label><input type="radio" name="preset" value="hyperpop"> Hyperpop</label>
        <label><input type="radio" name="preset" value="orchid"> Electric Orchid</label>
        <label><input type="radio" name="preset" value="rave"> Cyber Pastel Rave</label>
        <label><input type="radio" name="preset" value="custom"> Custom</label>
      </div>

      <div class="hud-section">
        <span class="ctrl-label">Team names &amp; colours</span>
        <div id="pwTeamControls"></div>
      </div>
    </details>

    <details class="hud-details" open>
      <summary>Gameplay</summary>

      <div class="hud-section">
        <span class="ctrl-label">Cell size: <span id="cellValue"></span>px</span>
        <input type="range" min="8" max="48" step="1" class="slider" id="cellSlider">
      </div>

      <div class="hud-section">
        <span class="ctrl-label">Ball speed: <span id="speedValue"></span></span>
        <input type="range" min="2" max="16" step="0.5" class="slider" id="speedSlider">
      </div>

      <div class="hud-section">
        <span class="ctrl-label">Balls per team: <span id="ballsValue"></span></span>
        <input type="range" min="1" max="8" step="1" class="slider" id="ballsSlider">
      </div>

      <div class="hud-section">
        <span class="ctrl-label">Field saturation: <span id="satValue"></span></span>
        <input type="range" min="20" max="100" step="1" class="slider" id="satSlider">
      </div>
    </details>

    <details class="hud-details">
      <summary>Display &amp; effects</summary>

      <div class="hud-section">
        <label><input type="checkbox" id="glowCheckbox" checked> Ball glow</label>
        <label><input type="checkbox" id="neonCheckbox" checked> Neo-Tokyo style</label>
        <label><input type="checkbox" id="trailCheckbox" checked> Comet trails</label>
        <label><input type="checkbox" id="crtCheckbox" checked> CRT overlay</label>
        <label><input type="checkbox" id="gridCheckbox" checked> Grid lines</label>
        <label><input type="checkbox" id="bloomCheckbox" checked> Bloom glow</label>
        <label><input type="checkbox" id="scoreCheckbox" checked> Show scoreboard</label>
        <label><input type="checkbox" id="autoCheckbox" checked> Auto-restart rounds</label>
      </div>
    </details>

    <details class="hud-details">
      <summary>Game area</summary>

      <div class="hud-section">
        <div class="pw-size-row" id="gameSizeRow">
          <input type="number" id="gameWidthInput" min="200" max="3840" step="10" value="1000">
          <span>×</span>
          <input type="number" id="gameHeightInput" min="200" max="2160" step="10" value="1000">
          <button id="applySizeBtn">Apply</button>
        </div>
      </div>
    </details>

    <details class="hud-details">
      <summary>Power-ups</summary>

      <div class="hud-section">
        <div id="pwPowerups"></div>
        <div class="pw-btn-row" style="margin-top: 8px;">
          <button id="testBanner">Banner</button>
          <button id="testShake">Shake</button>
        </div>
      </div>
    </details>

  </aside>

  <script type="module" src="main.js"></script>
  <script src="../JS/theme.js"></script>
  <script src="../JS/hudUtils.js"></script>
</body>
</html>
